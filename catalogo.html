<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Sarom Kids</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F5FFFA;
            color: #333;
        }

        header {
            background: #008B8B;
            padding: 20px;
            text-align: center;
            color: white;
        }

        nav {
            background: #E0FFFF;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #2F4F4F;
            font-weight: bold;
            transition: 0.2s;
        }

        nav a:hover {
            color: #008B8B;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .produto {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px;
            text-align: center;
        }

        .produto img {
            width: 100%;
            border-radius: 10px;
        }

        .produto h3 {
            color: #008B8B;
        }

        .produto button {
            background: #008080;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: .3s;
        }

        .produto button:hover {
            background: #008B8B;
        }
    </style>
</head>
<body>

<header>
    <h1>Catálogo Sarom Kids</h1>
</header>

<nav>
    <a href="index.html">Início</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="#">Promoções</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
    <a href="carrinho.html">🛒 Carrinho</a>
</nav>

<section class="catalogo">

    <div class="produto">
        <img src="https://via.placeholder.com/200x200?text=Vestido+Infantil">
        <h3>Vestido Floral</h3>
        <p>R$ 89,90</p>
        <button onclick="adicionarCarrinho('Vestido Floral', 89.90)">Comprar</button>
    </div>

    <div class="produto">
        <img src="https://via.placeholder.com/200x200?text=Conjunto+Menino">
        <h3>Conjunto Menino</h3>
        <p>R$ 79,90</p>
        <button onclick="adicionarCarrinho('Conjunto Menino', 79.90)">Comprar</button>
    </div>

    <div class="produto">
        <img src="https://via.placeholder.com/200x200?text=Body+Bebê">
        <h3>Body Bebê</h3>
        <p>R$ 49,90</p>
        <button onclick="adicionarCarrinho('Body Bebê', 49.90)">Comprar</button>
    </div>

</section>

<script>
    function adicionarCarrinho(nome, preco) {
        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
        carrinho.push({ nome, preco });
        localStorage.setItem("carrinho", JSON.stringify(carrinho));
        alert("Produto adicionado ao carrinho! 🛒");
    }
</script>

</body>
</html>
