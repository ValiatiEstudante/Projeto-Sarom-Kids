<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sarom Kids - Loja Infantil</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        header {
            background: #ff6fa8;
            padding: 20px;
            text-align: center;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        nav {
            background: #ffd9e8;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #d6336c;
            font-weight: bold;
            transition: 0.2s;
        }

        nav a:hover {
            color: #a61e4d;
        }

        .hero {
            padding: 50px;
            text-align: center;
        }

        .hero h2 {
            font-size: 28px;
            color: #d6336c;
        }

        .hero button {
            background: #ff6fa8;
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .hero button:hover {
            background: #d6336c;
        }

        footer {
            margin-top: 50px;
            background: #ff6fa8;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>Sarom Kids</h1>
    <p>Moda infantil com carinho e praticidade</p>
</header>

<nav>
    <a href="index.html">Início</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="#">Promoções</a>
    <a href="#">Sobre</a>
    <a href="#">Contato</a>
</nav>

<section class="hero">
    <h2>Bem-vindo à Sarom Kids</h2>
    <p>Veja nossos produtos, escolha suas peças e finalize sua compra com facilidade!</p>
    <button id="catalogoBtn">Ver Catálogo</button>
</section>

<footer>
    © 2025 - Sarom Kids — Todos os direitos reservados
</footer>

<script>
    // Mensagem de boas-vindas ao carregar o site
    window.onload = function() {
        alert("Bem-vindo à Sarom Kids! 💖");
    };

    // Botão que leva ao catálogo
    document.getElementById("catalogoBtn").addEventListener("click", function() {
        window.location.href = "catalogo.html";
    });
</script>

</body>
</html>
